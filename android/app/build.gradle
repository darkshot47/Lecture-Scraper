plugins { id 'com.android.application' }

android {
    namespace 'org.studyratna.saver'
    compileSdk 34

    defaultConfig {
        applicationId 'org.studyratna.saver'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug-signed release: sideload ke liye kaafi hai. Play Store ke liye
            // apna keystore banayein (README dekhein).
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    // WebView + MediaStore ke liye koi external dependency nahi chahiye
}
