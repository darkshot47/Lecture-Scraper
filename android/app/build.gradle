plugins { id 'com.android.application' }

android {
    namespace 'org.studyratna.saver'
    compileSdk 34

    defaultConfig {
        applicationId 'org.studyratna.saver'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug-signed release: sideload ke liye kaafi hai. Play Store ke liye
            // apna keystore banayein (README dekhein).
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}

dependencies {
    // ExoPlayer (Media3): HLS + AES-128 key support + DecoderFallback.
    // Isse "app me hi video dekhna" milta hai — WebView ki zaroorat nahi.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // FileProvider (cache file ko player app me kholne ke liye)
    implementation 'androidx.core:core:1.13.1'
}
