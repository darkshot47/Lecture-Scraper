<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecture Relay — India Edge</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">▶</div>
    <div>
      <h1>Lecture Relay</h1>
      <p class="sub">Token → segments → <b>playable MP4</b>. Sab kuch Vercel ke
      Mumbai (bom1) node se — <b>India IP, koi proxy nahi</b>.</p>
    </div>
  </header>

  <label for="tok">Lecture link ya playerToken</label>
  <textarea id="tok" spellcheck="false"
    placeholder="https://app.studyratna.org/?playerToken=...&nbsp;&nbsp;(ya sirf token)"></textarea>

  <div class="row">
    <button id="insp">1 · Token check</button>
    <button id="test">2 · Player test</button>
    <button id="plan">3 · Plan</button>
    <button id="dl" class="primary">4 · MP4 download</button>
  </div>

  <div class="progress"><div id="bar"></div></div>
  <pre id="log"></pre>

  <footer>
    <span id="region"></span>
    Token sirf aapke browser me rehta hai; server usse sirf player se baat karne
    ke liye use karta hai. Kuch bhi store nahi hota.
  </footer>
</div>
<script>
  fetch('/api/relay').then(r => r.json()).then(j => {
    document.getElementById('region').textContent =
      'server region: ' + (j.region || '?') + (j.region === 'bom1' ? ' (Mumbai ✅)' : '');
  }).catch(() => {});
</script>
<script src="/app.js"></script>
</body>
</html>
