name: Lecture Downloader

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'StudyRatna / Lecture URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Fix DNS and Network
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        for i in {1..3}; do sudo apt-get update && break || sleep 5; done

    - name: Install Dependencies
      run: |
        pip install playwright yt-dlp requests
        playwright install --with-deps chromium

    - name: Run Downloader Script
      env:
        TARGET_URL: ${{ inputs.target_url }}
      run: python downloader.py

    # FIX: purana path 'downloaded_lecture.mp4' exact tha — yt-dlp aksar
    # alag extension (.webm/.mkv) banata hai, isliye wildcard use karo.
    - name: Upload Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: downloaded-lecture
        path: downloaded_lecture.*
        if-no-files-found: warn

    # FIX: lecture na mile to bhi debug files upload karo taaki pata chale
    # kyun nahi mila (screenshot, page HTML, network log).
    - name: Upload Debug Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: |
          screenshot.png
          page.html
          network.log
        if-no-files-found: ignore
