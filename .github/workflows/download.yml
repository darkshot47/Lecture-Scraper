name: Lecture Downloader

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'StudyRatna / Lecture URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Fix DNS and Network
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        for i in {1..3}; do sudo apt-get update && break || sleep 5; done

    # Playwright browser cache — install fast hoga, token expire hone se pehle
    # downloader start ho jayega (pehli run slow, uske baad fast).
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium-v1
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Dependencies
      run: |
        pip install playwright yt-dlp requests
        playwright install --with-deps chromium

    - name: Run Downloader Script
      env:
        TARGET_URL: ${{ inputs.target_url }}
      run: python downloader.py

    - name: Upload Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: downloaded-lecture
        path: downloaded_lecture.*
        if-no-files-found: warn

    - name: Upload Debug Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: |
          screenshot.png
          page.html
          page_text.txt
          network.log
          api_responses.log
        if-no-files-found: ignore

    # Debug summary GitHub Release notes me post karo — token REDACTED hota hai.
    # (Repo me Issues band hain aur log-artifact download har jagah possible nahi,
    #  isliye Release notes use karte hain — API se sab padh sakte hain.)
    - name: Report Debug Summary as Release
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Safety: token kabhi release notes me na jaye
        for f in network.log api_responses.log page.html page_text.txt; do
          [ -f "$f" ] && sed -i -E 's/(playerToken=)[A-Za-z0-9%._-]+/\1REDACTED/g; s/[0-9a-f]{64,}:[0-9a-f]{64,}/TOKEN_REDACTED/g' "$f" || true
        done
        {
          echo "## Debug Report — Run [$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          echo ""
          echo "### Page text (page_text.txt, first 3000 chars)"
          echo '```'
          head -c 3000 page_text.txt 2>/dev/null || echo "(no page_text.txt)"
          echo '```'
          echo ""
          echo "### Network requests (network.log, first 150 lines)"
          echo '```'
          head -n 150 network.log 2>/dev/null || echo "(no network.log)"
          echo '```'
          echo ""
          echo "### API responses (api_responses.log, first 150 lines)"
          echo '```'
          head -n 150 api_responses.log 2>/dev/null || echo "(no api_responses.log)"
          echo '```'
        } > summary.md
        gh release create "debug-run-$GITHUB_RUN_ID" \
          --target "$GITHUB_SHA" \
          --title "Debug report run $GITHUB_RUN_ID" \
          --notes-file summary.md \
          --prerelease 2>&1 || echo "release create fail (ignore)"
