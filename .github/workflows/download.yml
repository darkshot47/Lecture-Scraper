name: Lecture Downloader

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'StudyRatna lecture URL (playerToken wala)'
        required: false
        default: ''
        type: string
      video_key:
        description: 'Optional: video UUID (token expire ho gaya ho to)'
        required: false
        default: ''
        type: string
      mode:
        description: 'download = lecture download, detect = key hunt, inspect = JS analysis'
        required: false
        default: 'download'
        type: choice
        options:
          - download
          - detect
          - manifest
          - stream
          - key
          - inspect
      with_browser:
        description: 'Browser install karo (real Chromium se key fetch / generic sites)'
        required: false
        default: false
        type: boolean

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      timeout-minutes: 12
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp pycryptodome requests imageio-ffmpeg curl_cffi
        ffmpeg -version 2>/dev/null | head -1 || (
          sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq ffmpeg
        ) || echo "WARN: ffmpeg missing"
        if [ "${{ inputs.with_browser }}" = "true" ] || [ "${{ inputs.mode }}" = "download" ]; then
          pip install playwright
          timeout 600 playwright install --with-deps chromium || echo "WARN: browser install fail"
          python check_browser.py || echo "WARN: browser launch fail"
        fi

    - name: Detect Key (mode=detect)
      if: inputs.mode == 'detect'
      env:
        TARGET_URL: ${{ inputs.target_url }}
        VIDEO_KEY: ${{ inputs.video_key }}
      run: |
        if [ "${{ inputs.with_browser }}" = "true" ]; then
          python probe_browser_key.py 2>&1 | tee run.log || true
        fi
        python probe_key.py 2>&1 | tee -a run.log || true
        python hunt_proxy_key.py 2>&1 | tee -a run.log || true
        cp run.log inspect_report.md

    - name: Key Hunt (mode=key)
      if: inputs.mode == 'key'
      env:
        TARGET_URL: ${{ inputs.target_url }}
      run: |
        python manifest_fresh.py 2>&1 | tee run.log || true
        python keygrab.py 2>&1 | tee -a run.log || true
        if [ -s hls_key.txt ]; then
          echo "--- key mili, download ---" | tee -a run.log
          python pw_download.py 2>&1 | tee -a run.log || true
        fi
        cp run.log inspect_report.md

    - name: Browser Stream Probe (mode=stream)
      if: inputs.mode == 'stream'
      env:
        TARGET_URL: ${{ inputs.target_url }}
      run: |
        if [ "${{ inputs.with_browser }}" = "true" ]; then
          python browser_stream_probe.py 2>&1 | tee -a run.log || true
        fi
        python keygrab.py 2>&1 | tee -a run.log || true
        if [ -s hls_key.txt ]; then
          echo "--- key mil gayi, poora download shuru ---" | tee -a run.log
          python pw_download.py 2>&1 | tee -a run.log || true
        fi
        if ! ls downloaded_lecture.* >/dev/null 2>&1; then
          python mse_capture.py 2>&1 | tee -a run.log || true
        fi
        python cf_policy_probe.py 2>&1 | tee -a run.log || true
        python key_final_probe.py 2>&1 | tee -a run.log || true
        if ls downloaded_lecture.* >/dev/null 2>&1; then
          echo "--- MSE capture se video mil gaya ---" | tee -a run.log
        elif [ -s hls_key.txt ]; then
          echo "--- key mili, full download shuru ---" | tee -a run.log
          python pw_download.py 2>&1 | tee -a run.log || true
        else
          python player_root_probe.py 2>&1 | tee -a run.log || true
          python player_open.py 2>&1 | tee -a run.log || true
          python key_proxy_probe.py 2>&1 | tee -a run.log || true
        fi
        cp run.log inspect_report.md

    - name: Probe Manifest API (mode=manifest)
      if: inputs.mode == 'manifest'
      env:
        TARGET_URL: ${{ inputs.target_url }}
      run: |
        python manifest_probe.py 2>&1 | tee run.log || true
        cp run.log inspect_report.md

    - name: Run Site Inspector (mode=inspect)
      if: inputs.mode == 'inspect'
      run: python inspect_site.py || true

    - name: Download Lecture (mode=download)
      if: inputs.mode == 'download'
      env:
        TARGET_URL: ${{ inputs.target_url }}
        HLS_KEY_HEX: ${{ inputs.video_key }}
        WAIT_SECONDS: '25'
      run: |
        set -o pipefail
        if [ -n "$TARGET_URL" ]; then
          # StudyRatna token URL: Playwright context se playlist+key+segments
          pip install playwright >/dev/null 2>&1 || true
          python pw_download.py 2>&1 | tee run.log || true
        fi
        if ! ls downloaded_lecture.* >/dev/null 2>&1; then
          echo "--- fallback: downloader.py ---" | tee -a run.log
          python downloader.py 2>&1 | tee -a run.log || true
        fi

    - name: Upload Video Artifact
      id: artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: downloaded-lecture
        path: |
          downloaded_lecture.mp4
          downloaded_lecture.ts
        if-no-files-found: warn

    - name: Upload Debug Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: |
          screenshot.png
          page.html
          page_text.txt
          network.log
          api_responses.log
          inspect_report.md
          run.log
          lecture_info.txt
          hls_key.txt
          fresh_video_url.txt
        if-no-files-found: ignore

    # MP4 ko GitHub Release asset banao -> seedha download link (zip nahi)
    - name: Publish MP4 as Release (direct download link)
      id: publish
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="lecture-$(date +%Y%m%d-%H%M%S)"
        cp run.log summary.md 2>/dev/null || echo "(no run.log)" > summary.md
        if [ -f downloaded_lecture.mp4 ]; then
          echo "## Lecture MP4 ready ✅" > notes.md
          echo "" >> notes.md
          grep -m1 "^\[+\] Lecture:" run.log >> notes.md 2>/dev/null || true
          echo "" >> notes.md
          echo "Release asset: downloaded_lecture.mp4 (direct download, zip nahi)" >> notes.md
          gh release create "$TAG" downloaded_lecture.mp4 \
            --title "Lecture MP4 $(date +%Y-%m-%d)" --notes-file notes.md || true
        elif [ -f downloaded_lecture.ts ]; then
          echo "## Lecture ready (TS) — MP4 remux nahi hua" > notes.md
          gh release create "$TAG" downloaded_lecture.ts \
            --title "Lecture TS $(date +%Y-%m-%d)" --notes-file notes.md || true
        else
          gh release create "debug-run-$GITHUB_RUN_ID" --target "$GITHUB_SHA" \
            --title "Debug report run $GITHUB_RUN_ID" --notes-file summary.md \
            --prerelease 2>&1 || echo "release create fail"
        fi
        gh release view "$TAG" --json assets,body \
          --jq '.assets[] | "DIRECT LINK: " + .url' 2>/dev/null || true
        gh release view "$TAG" --json body --jq .body 2>/dev/null || true
