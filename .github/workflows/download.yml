name: Download Lecture

# Triggers:
#  1) workflow_dispatch  -> Actions tab se manually (target_url input).
#  2) repository_dispatch (event_type: download-lecture) -> token ko Git me
#     commit kiye bina bhejne ka rasta:
#
#       gh api -X POST repos/<owner>/<repo>/dispatches \
#         -f event_type=download-lecture \
#         -f "client_payload[url]=https://app.studyratna.org/?playerToken=..."
#
# Token ~2 ghante me expire hota hai aur uske andar ka CloudFront signature bhi
# aksar pehle hi expire hota hai, isliye run se turant pehle fresh link banayein.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Fresh lecture URL with playerToken"
        required: true
        type: string
      wait_seconds:
        description: "Player ko stream load karne dena (seconds)"
        required: false
        default: "60"
        type: string
      record_seconds:
        description: "In-page playback recording kitni der (default 300s)"
        required: false
        default: "300"
        type: string
      record_mode:
        description: "1 = playback capture on (agar download block ho to)"
        required: false
        default: "1"
        type: string
  repository_dispatch:
    types: [download-lecture]
  push:
    paths:
      - ".github/workflows/download.yml"

permissions:
  contents: write

concurrency:
  group: download-lecture-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_URL: ${{ inputs.target_url || github.event.client_payload.url }}
  WAIT_SECONDS: ${{ inputs.wait_seconds || '60' }}

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Fix DNS
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf

      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3 || sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Real Chrome zaroori hai: Playwright ke bundled Chromium me H.264/AAC
      # (proprietary) codecs nahi hote, aur is site ka HLS H.264/TS hai.
      - name: Install Chrome + Chromium for Playwright
        timeout-minutes: 20
        run: |
          python -m playwright install --with-deps chromium chrome || \
            python -m playwright install --with-deps chromium

      # Recorder self-test: asli player ke bina bhi MSE capture + remux verify.
      # Yeh fail ho to neeche ka download bekaar hai, isliye pehle chalaate hain.
      - name: Self-test in-page recorder
        id: selftest
        continue-on-error: true
        run: python selftest_recorder.py

      - name: Self-test summary
        if: always()
        run: |
          {
            echo "## Recorder self-test: ${{ steps.selftest.outcome }}"
            echo '```json'
            cat selftest_report.json 2>/dev/null || echo '{"note":"no selftest_report.json"}'
            echo '```'
          } | tee selftest_summary.md

      - name: Guard on self-test
        if: steps.selftest.outcome != 'success'
        run: |
          echo "::warning::Recorder self-test fail - capture path is doubt, downloadable path still tried."

      - name: Mask input URL
        run: echo "::add-mask::$TARGET_URL"

      - name: Download lecture
        id: dl
        continue-on-error: true
        env:
          RECORD_SECONDS: ${{ inputs.record_seconds || '300' }}
          RECORD_MODE: ${{ inputs.record_mode || '1' }}
        run: python downloader.py

      - name: Show result
        if: always()
        run: |
          ls -la downloaded_lecture.* 2>/dev/null || echo "no downloaded_lecture.*"
          ls -la debug/ 2>/dev/null || true
          echo "--- report ---"
          cat run_report.md 2>/dev/null || echo "no report"

      - name: Upload lecture artifact
        if: steps.dl.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-lecture
          path: |
            downloaded_lecture.mp4
            downloaded_lecture.mkv
            downloaded_lecture.ts
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            debug/
            run_report.md
            selftest_report.json
            selftest_summary.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload capture (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-capture
          path: debug/capture_raw.mp4
          if-no-files-found: ignore
          retention-days: 7

      # Result ko ek DRAFT release me rakhte hain: main branch push par bhi
      # kabhi public na ho, aur token kabhi body/asset me na jaye.
      - name: Publish result (draft release)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.dl.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TAG="run-${{ github.run_id }}"
          TITLE="Lecture run #${{ github.run_number }} — $OUTCOME"
          {
            echo "Workflow result: **$OUTCOME**"
            echo "Run: $RUN_URL"
            echo
            cat selftest_summary.md 2>/dev/null || true
            echo
            cat run_report.md 2>/dev/null || echo "no run_report.md"
          } > /tmp/notes.md

          gh release create "$TAG" --draft --title "$TITLE" --notes-file /tmp/notes.md || \
            gh release edit "$TAG" --draft --title "$TITLE" --notes-file /tmp/notes.md

          for f in downloaded_lecture.mp4 downloaded_lecture.mkv downloaded_lecture.ts; do
            if [ -s "$f" ]; then
              gh release upload "$TAG" "$f" --clobber && echo "uploaded $f"
            fi
          done

      - name: Fail job if download failed
        if: steps.dl.outcome != 'success'
        run: |
          echo "::error::Lecture download nahi hui — run_report.md dekho."
          exit 1
