name: Lecture Downloader

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'StudyRatna / Lecture URL'
        required: true
        type: string
      mode:
        description: 'download = lecture download karo, inspect = site ka JS/API analysis'
        required: false
        default: 'download'
        type: choice
        options:
          - download
          - inspect
          - diag
      video_key:
        description: 'Optional: video UUID (jab token expire ho gaya ho)'
        required: false
        type: string
      with_browser:
        description: 'Browser fallback bhi install karo (slow, sirf normal sites ke liye)'
        required: false
        default: false
        type: boolean

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      timeout-minutes: 10
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp pycryptodome requests
        # ffmpeg runner par usually hota hai; na ho to install (best-effort)
        ffmpeg -version 2>/dev/null | head -1 || (
          sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq ffmpeg
        ) || echo "WARN: ffmpeg missing (HLS merge fail ho sakta hai)"
        if [ "${{ inputs.with_browser }}" = "true" ]; then
          pip install playwright
          timeout 420 playwright install --with-deps chromium || echo "WARN: browser install fail"
        fi

    - name: Run Key Hunter
      if: inputs.mode == 'diag'
      env:
        TARGET_URL: ${{ inputs.target_url }}
        VIDEO_KEY: ${{ inputs.video_key }}
      run: |
        python probe_key.py 2>&1 | tee run.log || true
        cp run.log inspect_report.md

    - name: Run Site Inspector
      if: inputs.mode == 'inspect'
      run: python inspect_site.py || true

    - name: Run Downloader Script
      if: inputs.mode != 'inspect'
      env:
        TARGET_URL: ${{ inputs.target_url }}
        WAIT_SECONDS: '25'
      run: |
        set -o pipefail
        python downloader.py 2>&1 | tee run.log

    - name: Upload Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: downloaded-lecture
        path: downloaded_lecture.*
        if-no-files-found: warn

    - name: Upload Debug Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: |
          screenshot.png
          page.html
          page_text.txt
          network.log
          api_responses.log
          inspect_report.md
          run.log
          lecture_info.txt
          hls_key.txt
        if-no-files-found: ignore

    # Debug summary GitHub Release notes me daal do — ise API se padha ja sakta hai
    # aur token/signature hamesha REDACTED rehta hai.
    - name: Report Debug Summary as Release
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for f in network.log api_responses.log page.html page_text.txt run.log; do
          [ -f "$f" ] && sed -i -E 's/(playerToken=)[A-Za-z0-9%._-]+/\1REDACTED/g; s/[0-9a-f]{64,}:[0-9a-f]{64,}/TOKEN_REDACTED/g' "$f" || true
        done
        {
          echo "## Debug Report — Run [$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          echo ""
          echo "### Run log (run.log, last 200 lines)"
          echo '```'
          tail -n 200 run.log 2>/dev/null || echo "(no run.log)"
          echo '```'
        } > summary.md
        if [ -f inspect_report.md ]; then
          cp inspect_report.md summary.md
        fi
        gh release create "debug-run-$GITHUB_RUN_ID" \
          --target "$GITHUB_SHA" \
          --title "Debug report run $GITHUB_RUN_ID" \
          --notes-file summary.md \
          --prerelease 2>&1 || echo "release create fail (ignore)"
