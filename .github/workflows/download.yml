name: Download Lecture

# Manual only: Actions -> Download Lecture -> Run workflow.
# `target_url` me APNE account ka fresh lecture link daalein
# (app.studyratna.org/?playerToken=...). Token ~2 ghante me expire hota hai,
# isliye har run se turant pehle naya link banayein.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Fresh lecture URL with playerToken (app se copy kiya hua)"
        required: true
        type: string
      wait_seconds:
        description: "Kitni der player ko stream load karne dena (default 45)"
        required: false
        default: "45"
        type: string
  push:
    paths:
      - ".github/workflows/download.yml"

permissions:
  contents: read

concurrency:
  group: download-lecture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # DNS fix: runners kabhi-kabhi pypi/playwright hosts resolve nahi karte
      - name: Fix DNS
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf

      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3 || sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        timeout-minutes: 15
        run: |
          python -m playwright install --with-deps chromium

      - name: Download lecture
        env:
          TARGET_URL: ${{ inputs.target_url }}
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
        run: python downloader.py

      - name: Show result
        if: always()
        run: |
          ls -la downloaded_lecture.* 2>/dev/null || echo "downloaded_lecture.*: Koi file nahi bani"
          ls -la debug/ 2>/dev/null || true
          echo "--- candidates ---"
          cat debug/candidates.txt 2>/dev/null | head -30 || true

      - name: Upload lecture
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-lecture
          path: |
            downloaded_lecture.mp4
            downloaded_lecture.ts
            downloaded_lecture.mkv
          if-no-files-found: error

      # Debug bundle: token/cookie redacted hai, par ise public repo me
      # release karna phir bhi avoid karein.
      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
