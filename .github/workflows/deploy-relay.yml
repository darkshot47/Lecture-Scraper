name: Deploy Relay (Vercel)

# Permanent solution ka deploy step.
# Kyun workflow: Vercel ka connector file-upload accept karta hai par
# projectSettings nahi bhej sakta, isliye CLI se deploy karte hain.
#
# Secrets chahiye: VERCEL_TOKEN  (Vercel -> Account -> Tokens)
# Optional:        VERCEL_ORG_ID, VERCEL_PROJECT_ID (nahi diye to CLI link karega)
#
# Flow: bom1 (Mumbai) -> fail -> automatic iad1 fallback -> verify

on:
  workflow_dispatch:
    inputs:
      region:
        description: "region (auto = bom1 try, phir iad1)"
        required: false
        default: "auto"
        type: string
      token:
        description: "optional: playerToken (verify ke liye)"
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [deploy-relay]
  push:
    branches: [main]
    paths:
      - "web/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Sanity check (files + syntax)
        run: |
          node --check api/relay.js
          node --check public/app.js 2>/dev/null || true
          python3 -c "import json; json.load(open('vercel.json'))"
          ls -la api public

      - name: Link project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret missing — Vercel -> Account -> Tokens se bana kar repo secret me daalein"
            exit 1
          fi
          mkdir -p .vercel
          ORG="${VERCEL_ORG_ID:-team_odRcYvU96I7aUZSWt0HeaP7e}"
          PRJ="${VERCEL_PROJECT_ID:-prj_trguyKhBAW4WhH7oAoJiFXVMAzOf}"
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG" "$PRJ" > .vercel/project.json
          echo "linked org=$ORG project=$PRJ"

      - name: Deploy via Vercel REST API (inline files)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PRJ: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          LOG=/tmp/deploy.log
          : > "$LOG"
          ORG="${ORG:-team_odRcYvU96I7aUZSWt0HeaP7e}"
          PRJ="${PRJ:-prj_trguyKhBAW4WhH7oAoJiFXVMAzOf}"
          REQ="${{ inputs.region || github.event.client_payload.region || 'auto' }}"
          if [ "$REQ" = "auto" ]; then REGIONS="bom1 iad1"; else REGIONS="$REQ"; fi

          python3 - "$PRJ" <<'PYEOF'
          import json, os, sys
          files = []
          for root, _, names in os.walk("."):
              if any(x in root for x in ("node_modules", ".git", ".vercel")):
                  continue
              for n in names:
                  fp = os.path.join(root, n)
                  rel = fp[2:] if fp.startswith("./") else fp
                  if rel.startswith(("api/", "public/")) or rel in ("package.json", "vercel.json"):
                      files.append({"file": rel, "data": open(fp, encoding="utf-8").read()})
          payload = {
              "name": "lecture-relay",
              "project": sys.argv[1],
              "target": "production",
              "files": files,
              "projectSettings": {
                  "framework": None,
                  "buildCommand": None,
                  "installCommand": None,
                  "outputDirectory": None,
                  "rootDirectory": None,
                  "nodeVersion": "20.x",
              },
          }
          json.dump(payload, open("/tmp/payload.json", "w"))
          print("payload files:", [f["file"] for f in files])
          PYEOF

          for REG in $REGIONS; do
            echo "=== region=$REG ===" | tee -a "$LOG"
            python3 -c "
          import json,sys
          p=json.load(open('/tmp/payload.json'))
          p['regions']=['$REG']
          json.dump(p, open('/tmp/payload.json','w'))
          "
            CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${ORG}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/payload.json)
            echo "HTTP $CODE" | tee -a "$LOG"
            head -c 4000 /tmp/resp.json | tee -a "$LOG"; echo | tee -a "$LOG"
            if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
              echo "region_used=$REG" >> "$GITHUB_OUTPUT"
              echo "ok=true" >> "$GITHUB_OUTPUT"
              tail -c 2000 /tmp/resp.json >> "$LOG"
              exit 0
            fi
            # token teamId galat ho to bina teamId try karo
            if [ "$CODE" = "403" ] || [ "$CODE" = "404" ]; then
              echo "-- retry without teamId --" | tee -a "$LOG"
              CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
                "https://api.vercel.com/v13/deployments?forceNew=1" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @/tmp/payload.json)
              echo "HTTP $CODE" | tee -a "$LOG"; head -c 3000 /tmp/resp.json | tee -a "$LOG"; echo | tee -a "$LOG"
              if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
                echo "region_used=$REG" >> "$GITHUB_OUTPUT"; echo "ok=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Publish deploy diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ steps.deploy.outputs.ok }}
          REGION: ${{ steps.deploy.outputs.region_used }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Deploy relay — result: **${OK:-false}**"
            echo ""
            echo "- region: \`${REGION:-n/a}\`"
            echo "- url: ${URL:-n/a}"
            echo ""
            echo '```'
            tail -c 6000 /tmp/deploy.log 2>/dev/null || echo "(deploy.log khali - step shuru hi nahi hua)"
            echo '```'
          } > /tmp/diag.md
          echo "--- diag.md ---"; cat /tmp/diag.md
          # Job summary API se padi ja sakti hai (step logs nahi). Chhota rakho.
          B64=$(base64 -w0 /tmp/deploy.log 2>/dev/null | tail -c 60000)
          {
            echo "## Deploy relay — ${OK:-false}"
            echo ""
            echo "- region: \`${REGION:-n/a}\` / url: ${URL:-n/a}"
            echo ""
            echo "\`\`\`\`"
            echo "$B64"
            echo "\`\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Releases yahan se readable nahi hote; commit comment pe padi jaati hai.
          {
            echo "**Relay deploy diag** — result: ${OK:-false}"
            echo ""
            echo '```'
            tail -c 20000 /tmp/deploy.log 2>/dev/null || echo "(deploy.log khali)"
            echo '```'
          } > /tmp/comment.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/comment.md)" --jq '.id' || echo "commit comment fail"

      - name: Verify deployed function
        if: steps.deploy.outputs.ok == 'true'
        run: |
          echo "BASE=$BASE"
          echo "--- root json (region) ---"
          curl -sS --max-time 30 "$BASE/api/relay" | tee /tmp/root.json || true
          echo
          echo "--- player probe (asli test) ---"
          if [ -n "$TOK" ]; then
            curl -sS --max-time 60 "$BASE/api/relay?action=selftest&token=$TOK" | tee /tmp/probe.json || true
          else
            echo "(token nahi diya — sirf region check)"
          fi
          echo
          {
            echo "### Relay deploy"
            echo ""
            echo "- URL: $BASE"
            echo "- region requested: \`${{ steps.deploy.outputs.region_used }}\`"
            echo ""
            echo '```json'
            head -c 2500 /tmp/root.json 2>/dev/null || true
            echo
            head -c 2500 /tmp/probe.json 2>/dev/null || true
            echo '```'
          } > /tmp/notes.md
          gh release create "relay-${GITHUB_RUN_ID}" --draft --title "Relay deploy" --notes-file /tmp/notes.md || true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.deploy.outputs.url }}
          TOK: ${{ inputs.token || github.event.client_payload.token }}
