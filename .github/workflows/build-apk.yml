name: Build Android APK

# Manual: Actions -> Build Android APK -> Run workflow.
# APK ban jaane par ek DRAFT release (tag apk-<run>) ke saath attach hota hai;
# wahan se APK phone par download karke install karein.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (default 2.0)"
        required: false
        default: "2.0"
        type: string
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android runner par fail hua tha; SDK manually,
      # sdkmanager se (ubuntu-latest me Android SDK preinstalled bhi hota hai).
      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          if [ ! -d "$SDK_ROOT/cmdline-tools/latest" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            cd "$SDK_ROOT"
            curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q tools.zip -d cmdline-tools-tmp
            mv cmdline-tools-tmp/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf cmdline-tools-tmp tools.zip
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # repo me gradlew nahi hai — workflow hi wrapper bana deta hai
      - name: Gradle wrapper generate
        working-directory: android
        run: |
          set -e
          gradle wrapper --gradle-version 8.7 --no-daemon
          test -x gradlew
          ./gradlew --version | head -5

      - name: Check WebView injection script
        run: |
          node --check android/inject_webview.js
          node --check android/app/src/main/assets/recorder.js
          echo "inject_webview.js + recorder.js syntax OK"
          # asset app me hi jaana chahiye (single source of truth)
          cmp android/inject_webview.js android/app/src/main/assets/inject_webview.js
          echo "asset copy identical"

      - name: Source sanity (native classes)
        run: |
          set -e
          for f in Token Downloader NetSniffer PlayerActivity PageActivity GalleryWriter BrowserNet Origin Http NetProbe SameOrigin MediaRelay MainActivity; do
            test -f "android/app/src/main/java/org/studyratna/saver/$f.java" \
              && echo "OK $f.java" || { echo "MISSING $f.java"; exit 1; }
          done
          grep -q "media3-exoplayer-hls" android/app/build.gradle
          grep -q "okhttp" android/app/build.gradle
          grep -q "media3-datasource-okhttp" android/app/build.gradle
          grep -q "FileProvider" android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/xml/file_paths.xml

      - name: Assemble debug APK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          echo "---- compiler lines ----"
          grep -E "^e: |error: |FAILURE:" /tmp/build.log | head -60 || true
          tail -5 /tmp/build.log || true

      - name: Assemble release APK (debug-signed)
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee /tmp/build-rel.log
          echo "---- compiler lines ----"
          grep -E "^e: |error: |FAILURE:" /tmp/build-rel.log | head -60 || true
          tail -5 /tmp/build-rel.log || true

      - name: Report compile errors (agar fail hue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          N=0
          grep -hE "^e: |error:|FAILURE:|What went wrong" /tmp/build.log /tmp/build-rel.log 2>/dev/null \
            | tr -d '\r' | head -12 > /tmp/lines.txt
          while IFS= read -r line; do
            N=$((N+1))
            # har line apna tag: pure ASCII, koi & / ? nahi
            # poora diag line: sirf alnum + dash (100 chars) — tag me koi galat char na aaye
            SLUG=$(printf '%s' "$line" | tr -cd 'A-Za-z0-9' | tail -c 100)
            gh release create "e$N-43707173372-$SLUG" --title "err $N: ${{ github.run_id }}" \
              --notes "log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          done < /tmp/lines.txt
          echo "posted $N error lines"

      - name: Verify APK contents
        id: verify
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          {
            echo "### APK verification"
            echo
            echo "size: $(stat -c%s "$APK") bytes"
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo
            echo '```'
            unzip -l "$APK"
            echo '```'
            echo
          } | tee verify.md

          fail=0
          for f in AndroidManifest.xml classes.dex resources.arsc; do
            if unzip -l "$APK" | awk '{print $NF}' | grep -qx "$f"; then
              echo "- OK core entry: $f" | tee -a verify.md
            else
              echo "- MISSING core entry: $f" | tee -a verify.md
              fail=1
            fi
          done

          DEX_BYTES=$(unzip -l "$APK" | awk '$NF=="classes.dex"{print $(NF-3)}')
          echo "- classes.dex size: ${DEX_BYTES:-unknown}" | tee -a verify.md

          # badging (best effort - tool path runner image par badal sakta hai)
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          if [ -x "$AAPT" ]; then
            echo '```' >> verify.md
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -E "package:|launchable-activity:|sdkVersion|targetSdkVersion" >> verify.md || echo "aapt badging failed" >> verify.md
            echo '```' >> verify.md
          else
            echo "- aapt: NOT FOUND at $AAPT (skipped)" | tee -a verify.md
          fi

          # packaged recorder asset: valid JS + hooks
          if unzip -p "$APK" assets/inject_webview.js > /tmp/asset.js 2>/dev/null; then
            if command -v node >/dev/null && node --check /tmp/asset.js; then
              echo "- assets/inject_webview.js: $(wc -c < /tmp/asset.js) bytes, JS valid" | tee -a verify.md
            else
              echo "- assets/inject_webview.js: JS INVALID" | tee -a verify.md
              fail=1
            fi
            for hook in __lsStartDump appendBuffer __lsStatus; do
              if grep -q "$hook" /tmp/asset.js; then
                echo "- hook present: $hook" | tee -a verify.md
              else
                echo "- hook MISSING: $hook" | tee -a verify.md
                fail=1
              fi
            done
          else
            echo "- assets/inject_webview.js: MISSING from APK" | tee -a verify.md
            fail=1
          fi

          # MediaStore strings: dex ke andar classes.dex + strings tool optional
          if unzip -p "$APK" > /tmp/all.bin 2>/dev/null && grep -aq "RELATIVE_PATH" /tmp/all.bin; then
            echo "- MediaStore RELATIVE_PATH: present" | tee -a verify.md
          else
            echo "- MediaStore RELATIVE_PATH: NOT FOUND (check strings)" | tee -a verify.md
            fail=1
          fi

          rm -f /tmp/all.bin
          echo
          echo "===== VERIFY.MD START ====="
          cat verify.md
          echo "===== VERIFY.MD END ====="
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then cat verify.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$fail" -ne 0 ]; then
            # APK ban gaya to build fail nahi karte — sirf warning (install test user karega)
            echo "::warning::APK verification me kuch checks fail hue (dekho verify.md)"
          fi
          echo "APK verification: all checks passed"

      - name: Locate APKs
        id: apks
        run: |
          set +e
          echo "---- debug dir ----"
          ls -la android/app/build/outputs/apk/debug/ || true
          echo "---- release dir ----"
          ls -la android/app/build/outputs/apk/release/ || true
          # poore build tree me APK dhoondo (path AGP version ke hisaab se badalta hai)
          find android -name "*.apk" -type f | sort > /tmp/apks.txt || true
          cat /tmp/apks.txt
          REL=$(grep -i "release" /tmp/apks.txt | grep -vi unsigned | head -1)
          [ -z "$REL" ] && REL=$(grep -i "release" /tmp/apks.txt | head -1)
          DBG=$(grep -i "debug" /tmp/apks.txt | head -1)
          [ -n "$DBG" ] && cp "$DBG" "lecture-saver-${{ inputs.version_name || '2.0' }}-debug.apk"
          [ -n "$REL" ] && cp "$REL" "lecture-saver-${{ inputs.version_name || '2.0' }}.apk"
          ls -la *.apk || true
          if ls *.apk >/dev/null 2>&1; then echo "ok=1" >> $GITHUB_OUTPUT; else echo "ok=0" >> $GITHUB_OUTPUT; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lecture-saver-apk
          path: "*.apk"
          if-no-files-found: warn
          retention-days: 14

      - name: Publish APK release
        if: always() && steps.apks.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          TAG="apk-${{ github.run_id }}"
          {
            echo "Lecture Saver APK (debug-signed, sideload ke liye)"
            echo
            echo "- version: ${{ inputs.version_name || '2.0' }}"
            echo "- commit: ${{ github.sha }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- apk verification step: $VERIFY_OUTCOME"
            echo
            echo "Install: APK download -> phone par 'Install unknown apps' allow -> install."
            echo "Ye app sirf un lectures ke liye hai jinhe aap legally dekh sakte hain."
            echo
            echo "### Build verification"
            echo
            cat verify.md 2>/dev/null || echo "(verify.md missing)"
            echo
            echo "### APK files found"
            echo '```'
            cat /tmp/apks.txt 2>/dev/null || echo "(none)"
            echo '```'
            echo
            echo "### Apk copy"
            ls -la *.apk 2>/dev/null || echo "(no *.apk in workspace root)"
          } > /tmp/notes.md
          gh release create "$TAG" --title "Lecture Saver APK 2.0 (Dekho + Download)" --notes-file /tmp/notes.md
          gh release upload "$TAG" *.apk --clobber
          echo "Uploaded to draft release $TAG"
