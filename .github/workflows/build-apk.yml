name: Build Android APK

# Manual: Actions -> Build Android APK -> Run workflow.
# APK ban jaane par ek DRAFT release (tag apk-<run>) ke saath attach hota hai;
# wahan se APK phone par download karke install karein.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (default 1.0)"
        required: false
        default: "1.0"
        type: string
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android runner par fail hua tha; SDK manually,
      # sdkmanager se (ubuntu-latest me Android SDK preinstalled bhi hota hai).
      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          if [ ! -d "$SDK_ROOT/cmdline-tools/latest" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            cd "$SDK_ROOT"
            curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q tools.zip -d cmdline-tools-tmp
            mv cmdline-tools-tmp/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf cmdline-tools-tmp tools.zip
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check WebView injection script
        run: |
          node --check android/inject_webview.js
          echo "inject_webview.js syntax OK"
          # asset app me hi jaana chahiye (single source of truth)
          cmp android/inject_webview.js android/app/src/main/assets/inject_webview.js
          echo "asset copy identical"

      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK (debug-signed)
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK contents
        id: verify
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          {
            echo "### APK verification"
            echo
            echo "size: $(stat -c%s "$APK") bytes"
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo
            echo '```'
            unzip -l "$APK"
            echo '```'
            echo
          } | tee verify.md

          fail=0
          for f in AndroidManifest.xml classes.dex resources.arsc; do
            if unzip -l "$APK" | awk '{print $NF}' | grep -qx "$f"; then
              echo "- OK core entry: $f" | tee -a verify.md
            else
              echo "- MISSING core entry: $f" | tee -a verify.md
              fail=1
            fi
          done

          DEX_BYTES=$(unzip -l "$APK" | awk '$NF=="classes.dex"{print $(NF-3)}')
          echo "- classes.dex size: ${DEX_BYTES:-unknown}" | tee -a verify.md

          # badging (best effort - tool path runner image par badal sakta hai)
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          if [ -x "$AAPT" ]; then
            echo '```' >> verify.md
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -E "package:|launchable-activity:|sdkVersion|targetSdkVersion" >> verify.md || echo "aapt badging failed" >> verify.md
            echo '```' >> verify.md
          else
            echo "- aapt: NOT FOUND at $AAPT (skipped)" | tee -a verify.md
          fi

          # packaged recorder asset: valid JS + hooks
          if unzip -p "$APK" assets/inject_webview.js > /tmp/asset.js 2>/dev/null; then
            if command -v node >/dev/null && node --check /tmp/asset.js; then
              echo "- assets/inject_webview.js: $(wc -c < /tmp/asset.js) bytes, JS valid" | tee -a verify.md
            else
              echo "- assets/inject_webview.js: JS INVALID" | tee -a verify.md
              fail=1
            fi
            for hook in __lsStartDump appendBuffer __lsStatus; do
              if grep -q "$hook" /tmp/asset.js; then
                echo "- hook present: $hook" | tee -a verify.md
              else
                echo "- hook MISSING: $hook" | tee -a verify.md
                fail=1
              fi
            done
          else
            echo "- assets/inject_webview.js: MISSING from APK" | tee -a verify.md
            fail=1
          fi

          # MediaStore strings: dex ke andar classes.dex + strings tool optional
          if unzip -p "$APK" > /tmp/all.bin 2>/dev/null && grep -aq "RELATIVE_PATH" /tmp/all.bin; then
            echo "- MediaStore RELATIVE_PATH: present" | tee -a verify.md
          else
            echo "- MediaStore RELATIVE_PATH: NOT FOUND (check strings)" | tee -a verify.md
            fail=1
          fi

          rm -f /tmp/all.bin
          echo
          echo "===== VERIFY.MD START ====="
          cat verify.md
          echo "===== VERIFY.MD END ====="
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then cat verify.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$fail" -ne 0 ]; then
            echo "::warning::APK verification me kuch checks fail hue (dekho verify.md)"
            exit 1
          fi
          echo "APK verification: all checks passed"

      - name: Locate APKs
        id: apks
        run: |
          set -e
          ls -la android/app/build/outputs/apk/debug/ android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/debug/app-debug.apk lecture-saver-${{ inputs.version_name || '1.0' }}-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk lecture-saver-${{ inputs.version_name || '1.0' }}.apk
          ls -la *.apk
          echo "ok=1" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lecture-saver-apk
          path: "*.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        if: always() && steps.apks.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          TAG="apk-${{ github.run_id }}"
          {
            echo "Lecture Saver APK (debug-signed, sideload ke liye)"
            echo
            echo "- version: ${{ inputs.version_name || '1.0' }}"
            echo "- commit: ${{ github.sha }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- apk verification step: $VERIFY_OUTCOME"
            echo
            echo "Install: APK download -> phone par 'Install unknown apps' allow -> install."
            echo "Ye app sirf un lectures ke liye hai jinhe aap legally dekh sakte hain."
            echo
            echo "### Build verification"
            echo
            cat verify.md 2>/dev/null || echo "(verify.md missing)"
          } > /tmp/notes.md
          gh release create "$TAG" --title "Lecture Saver APK ${{ inputs.version_name || '1.0' }}" --notes-file /tmp/notes.md
          gh release upload "$TAG" *.apk --clobber
          echo "Uploaded to draft release $TAG"
