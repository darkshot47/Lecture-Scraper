name: Build Android APK

# Manual: Actions -> Build Android APK -> Run workflow.
# APK ban jaane par ek DRAFT release (tag apk-<run>) ke saath attach hota hai;
# wahan se APK phone par download karke install karein.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (default 1.0)"
        required: false
        default: "1.0"
        type: string
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android runner par fail hua tha; SDK manually,
      # sdkmanager se (ubuntu-latest me Android SDK preinstalled bhi hota hai).
      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          if [ ! -d "$SDK_ROOT/cmdline-tools/latest" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            cd "$SDK_ROOT"
            curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q tools.zip -d cmdline-tools-tmp
            mv cmdline-tools-tmp/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf cmdline-tools-tmp tools.zip
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check WebView injection script
        run: |
          node --check android/inject_webview.js
          echo "inject_webview.js syntax OK"
          # asset app me hi jaana chahiye (single source of truth)
          cmp android/inject_webview.js android/app/src/main/assets/inject_webview.js
          echo "asset copy identical"

      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK (debug-signed)
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK contents
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "== zip listing ==" | tee verify.md
          unzip -l "$APK" | tee -a verify.md
          echo | tee -a verify.md

          # 1) manifest + dex + resources hone chahiye (warna APK install hi nahi hoga)
          for f in AndroidManifest.xml classes.dex resources.arsc; do
            unzip -l "$APK" | grep -q " $f$" || { echo "MISSING $f" | tee -a verify.md; exit 1; }
          done
          DEX=$(unzip -l "$APK" | awk '$4=="classes.dex"{print $1}')
          echo "- classes.dex: $DEX bytes" | tee -a verify.md

          # 2) badging: package + launchable activity
          BT="$ANDROID_HOME/build-tools/34.0.0"
          if [ -x "$BT/aapt2" ]; then
            "$BT/aapt2" dump badging "$APK" 2>/dev/null | head -5 | tee -a verify.md || true
          fi
          "$BT/aapt" dump badging "$APK" 2>/dev/null | grep -E "package:|launchable-activity:|sdkVersion|targetSdkVersion" | tee -a verify.md || true

          # 3) recorder asset packaged + valid JS + hooks present
          unzip -p "$APK" assets/inject_webview.js > /tmp/asset.js
          node --check /tmp/asset.js
          grep -q "__lsStartDump" /tmp/asset.js
          grep -q "appendBuffer" /tmp/asset.js
          echo "- assets/inject_webview.js: $(wc -c < /tmp/asset.js) bytes, hooks OK" | tee -a verify.md

          # 4) MediaStore string dex me hai (save path gallery me jaata hai)
          if unzip -p "$APK" classes.dex | strings | grep -q "RELATIVE_PATH"; then
            echo "- MediaStore RELATIVE_PATH: present in dex" | tee -a verify.md
          else
            echo "- MediaStore RELATIVE_PATH: NOT FOUND" | tee -a verify.md
            exit 1
          fi

          echo | tee -a verify.md
          echo "- release APK size: $(stat -c%s "$APK") bytes" | tee -a verify.md
          echo "- sha256: $(sha256sum "$APK" | cut -d' ' -f1)" | tee -a verify.md

      - name: Locate APKs
        id: apks
        run: |
          set -e
          ls -la android/app/build/outputs/apk/debug/ android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/debug/app-debug.apk lecture-saver-${{ inputs.version_name || '1.0' }}-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk lecture-saver-${{ inputs.version_name || '1.0' }}.apk
          ls -la *.apk
          echo "ok=1" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lecture-saver-apk
          path: "*.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Publish draft release with APK
        if: always() && steps.apks.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_id }}"
          {
            echo "Lecture Saver APK (debug-signed, sideload ke liye)"
            echo
            echo "- version: ${{ inputs.version_name || '1.0' }}"
            echo "- commit: ${{ github.sha }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Install: APK download -> phone par 'Install unknown apps' allow -> install."
            echo "Ye app sirf un lectures ke liye hai jinhe aap legally dekh sakte hain."
            echo
            echo "### Build verification"
            echo
            cat verify.md 2>/dev/null || echo "(verify.md missing)"
          } > /tmp/notes.md
          gh release create "$TAG" --draft --title "Lecture Saver APK ${{ inputs.version_name || '1.0' }}" --notes-file /tmp/notes.md
          gh release upload "$TAG" *.apk --clobber
          echo "Uploaded to draft release $TAG"
