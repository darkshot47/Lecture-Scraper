name: Inspect Site

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Inspector
      run: python inspect_site.py || true

    - name: Publish Report as Release
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "inspect-$GITHUB_RUN_ID" \
          --target "$GITHUB_SHA" \
          --title "Inspect report $GITHUB_RUN_ID" \
          --notes-file inspect_report.md \
          --prerelease 2>&1 || echo "release fail"

    - name: Upload Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: inspect-report
        path: inspect_report.md
        if-no-files-found: ignore
